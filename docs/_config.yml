title: ctxerrors
tagline: Go errors that know where they happened
description: A Go library that wraps errors with the file, line and function where they were created or wrapped, translates foreign driver errors into your own sentinels, and ships a package of common sentinel errors.
lang: en
url: https://psyb0t.github.io
baseurl: /ctxerrors
repository: psyb0t/ctxerrors
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/ctxerrors
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/ctxerrors/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/ctxerrors
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
